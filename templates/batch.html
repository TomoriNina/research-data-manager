<!--实验批次管理页面-->
<!DOCTYPE html>
<html lang="zh-CN">
    <head>
        <meta charset="UTF-8">
        <title>实验批次管理</title>
        <link rel="stylesheet" href="https://cdn.bootcdn.net/ajax/libs/bootstrap/3.3.7/css/bootstrap.min.css">
    </head>
    <body>
        <div class="container">
            
            <h2>当前课题：{{ project_name }}</h2>

            <a href="/" class="btn btn-default">返回课题列表</a>
            <hr>

            <!--新增实验批次-->
            <form action="/add_batch" method="post" class="form-inline">
                <input type="hidden" name="project_id" value="{{ project_id }}">
                实验批次名称：<input type="text" name="batch_name" placeholder="请输入实验批次名称" required class="form-control">
                实验日期（不填则默认为当前日期）：<input type="date" name="experiment_date" class="form-control">
                实验备注（选填）：<input type="text" name="remark" placeholder="请输入实验备注" class="form-control">
                <button type="submit" class="btn btn-success">新增实验批次</button>
            </form>
            <hr>

            <!--现有实验批次-->
            <h4>实验批次列表</h4>
            <table class="table table-bordered">
                <tr>
                    <th>批次ID</th>
                    <th>批次名称</th>
                    <th>实验日期</th>
                    <th>备注</th>
                    <th>操作</th>
                </tr>
                {% for b in batches %}
                <tr>
                    <td>{{ b[0] }}</td>
                    <td>{{ b[1] }}</td>
                    <td>{{ b[3] }}</td>
                    <td>{{ b[4] }}</td>
                    <td>
                        <a href="/param/{{ b[0] }}" class="btn btn-info btn-xs">查看实验参数</a>
                        <a href="/edit_batch/{{ b[0] }}" class="btn btn-warning btn-xs">编辑批次信息</a>
                        <a href="/delete_batch/{{ b[0] }}/{{ b[2] }}" onclick="return confirm('确定删除该批次吗？')" class="btn btn-danger btn-xs">删除批次</a>
                    </td>
                </tr>
                {% endfor %}
            </table>

        </div>
    </body>
</html>
